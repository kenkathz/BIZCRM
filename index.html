<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%}
body{background:#010409;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
input,select,textarea,button{font-family:inherit}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{
  filter:invert(1);
  opacity:0.7;
  cursor:pointer;
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0d1117}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

/* ── layout ── */
.app{display:flex;height:100vh;width:100%;overflow:hidden;position:relative}
.sidebar{
  width:220px;min-width:220px;background:#0d1117;
  border-right:1px solid #21262d;
  display:flex;flex-direction:column;
  height:100vh;flex-shrink:0;
  transition:transform .25s ease;
  z-index:50;
}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0}

/* top bar only shows on mobile */
.topbar{display:none;align-items:center;gap:12px;padding:12px 16px;background:#0d1117;border-bottom:1px solid #21262d;position:sticky;top:0;z-index:40}
.ham{background:none;border:none;color:#c9d1d9;font-size:22px;cursor:pointer;padding:2px 4px;line-height:1;touch-action:manipulation}
.overlay{display:none;position:fixed;inset:0;background:#000000aa;z-index:45}

/* nav items */
.nav-item{
  width:100%;display:flex;align-items:center;gap:11px;
  padding:10px 14px;border-radius:8px;border:none;
  background:transparent;color:#6b7280;
  font-size:13px;cursor:pointer;text-align:left;
  font-weight:400;transition:background .12s,color .12s;
  touch-action:manipulation;
}
.nav-item:hover{background:#161b22;color:#f0f6fc}
.nav-item.active{background:#161b22;color:#f0f6fc;font-weight:600}
.nav-item .ni{font-size:16px;flex-shrink:0}
.nav-sep{font-size:9px;color:#4b5563;text-transform:uppercase;letter-spacing:.12em;padding:10px 14px 4px;margin-top:6px}

/* page padding */
.pg{padding:24px}

/* responsive */
@media(max-width:768px){
  .sidebar{
    position:fixed;top:0;left:0;height:100vh;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0)}
  .overlay.open{display:block}
  .topbar{display:flex}
  .main{padding-bottom:0}
  .pg{padding:16px!important}
  .mgrid{grid-template-columns:1fr 1fr!important}
  .fgrid{grid-template-columns:1fr!important}
  .dpanel{width:100%!important;border-left:none!important}
  .ugrid{grid-template-columns:1fr!important}
  .ph{flex-direction:column!important;gap:10px!important;align-items:stretch!important}
  .frow{flex-direction:column!important}
  .frow input,.frow select{width:100%!important}
  .pgrid{grid-template-columns:1fr 1fr!important}
}
@media(max-width:480px){
  .mgrid{grid-template-columns:1fr 1fr!important}
  .pgrid{grid-template-columns:1fr!important}
}
</style>
</head>

/*
  useFirebaseCollection(path, defaultValue, seedData)
  - Returns [data, setData, status]

    seed data so sample records appear on first use.
  - status: "loading" | "ready" | "offline"

  const [status, setStatus] = useState(_fbReady ? "loading" : "offline");

  useEffect(function() {
    if (!_fbReady || !_db) { setStatus("offline"); return; }
    const ref = _db.ref(path);
    const handler = ref.on("value", function(snap) {
      const val = snap.val();
      if (val === null) {
        /* Nothing in DB yet - seed with sample data if provided */
        if (seedData && !seededRef.current) {
          seededRef.current = true;
          const obj = {};
          seedData.forEach(function(item) { obj[item.id] = item; });
          ref.set(obj);
        } else {
          setDataLocal(defaultValue);
        }
      } else {
        const arr = Object.values(val);
        setDataLocal(arr);
      }
      setStatus("ready");
    }, function(err) {
      console.warn("Firebase read error on", path, err.message);
      setStatus("offline");

    return function() { ref.off("value", handler); };

  /* Wrap setter so writes also go to Firebase */

      if (_fbReady && _db) {
        const obj = {};
        next.forEach(function(item) { obj[item.id] = item; });
        _db.ref(path).set(obj).catch(function(e) {
          console.warn("Firebase write error on", path, e.message);
        });
      }
      return next;
    });
  }

  return [data, setData, status];
}
